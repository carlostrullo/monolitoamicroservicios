services:
  members-service:
    build:
      context: ./members-service
    container_name: members-service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - DATABASE_URL=sqlite:////data/members.db
      - DEBUG=0
    volumes:
      - members_data:/data

  trainers-service:
    build:
      context: ./trainers-service
    container_name: trainers-service
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - DATABASE_URL=sqlite:////data/trainers.db
      - DEBUG=0
    volumes:
      - trainers_data:/data

  classes-service:
    build:
      context: ./classes-service
    container_name: classes-service
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - DATABASE_URL=sqlite:////data/classes.db
      - DEBUG=0
      # URLs internas entre contenedores (NO localhost)
      - TRAINERS_BASE_URL=http://trainers-service:8002
      - MEMBERS_BASE_URL=http://members-service:8001
      - EQUIPMENT_BASE_URL=http://equipment-service:8004
      - REQUEST_TIMEOUT_SECONDS=2
    depends_on:
      - members-service
      - trainers-service
      - equipment-service
    volumes:
      - classes_data:/data

  equipment-service:
    build:
      context: ./equipment-service
    container_name: equipment-service
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - DATABASE_URL=sqlite:////data/equipment.db
      - DEBUG=0
    volumes:
      - equipment_data:/data

volumes:
  members_data:
  trainers_data:
  classes_data:
  equipment_data: